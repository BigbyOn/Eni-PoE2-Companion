<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eni-PoE2-Companion</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <aside id="nav">
    <div id="brand">
      <span class="sigil" aria-hidden="true"></span>
      <div class="brand-text">
        <b>Eni</b>
        <span>PoE2 Companion</span>
      </div>
    </div>
    <nav id="nav-items" aria-label="Разделы"></nav>
    <div class="nav-foot">
      <span id="ver" class="mono"></span>
      <small data-i18n="nav.hint"></small>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <h1 id="page-title"></h1>
      <div id="chips"></div>
    </header>
    <section id="content" tabindex="-1"></section>
  </main>
</div>
<div id="modal" hidden>
  <div id="modal-box" role="dialog" aria-modal="true">
    <header><h2 id="modal-title"></h2><button class="icon" data-act="modal-close" title="Esc">✕</button></header>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
