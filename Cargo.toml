[package]
name = "eni-poe2-companion"
version = "0.13.0"
edition = "2021"
description = "Eni-PoE2-Companion — помощник и оверлей для Path of Exile 2 (RU/EN)"
license = "MIT"
authors = ["BigbyOn", "Michael Malura"]
repository = "https://github.com/BigbyOn/Eni-PoE2-Companion"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
# Only the opt-in AI calls use it; no other network access exists.
ureq = "=3.4.2"
flate2 = "1"
quick-xml = "0.38"
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
] }

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
