name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # The version in tauri.conf.json must match the tag (v0.1.0 -> 0.1.0).
      - name: Check version against tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tauri.conf.json has $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Unit tests
        run: cargo test --locked

      - name: Build installers (NSIS setup.exe + MSI)
        run: npx --yes @tauri-apps/cli@2.12.1 build

      # Release assets get the names the release notes use.
      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $exe.FullName "dist/Eni-PoE2-Companion-Setup.exe"
          Copy-Item $msi.FullName "dist/Eni-PoE2-Companion.msi"
          Get-FileHash dist/Eni-PoE2-Companion-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Eni-PoE2-Companion-Setup.exe" } | Set-Content dist/SHA256SUMS.txt
          Get-FileHash dist/Eni-PoE2-Companion.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Eni-PoE2-Companion.msi" } | Add-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Select-Object Name, Length
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Eni-PoE2-Companion $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            dist/Eni-PoE2-Companion-Setup.exe dist/Eni-PoE2-Companion.msi dist/SHA256SUMS.txt
